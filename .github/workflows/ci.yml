name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release:
        description: build in release mode (versioned packages, versioned image tags)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !inputs.release }}

permissions:
  contents: read

env:
  ZIG_VERSION: 0.14.1
  GO_VERSION: "1.23"
  OPENWRT_24: 24.10.8
  OPENWRT_25: 25.12.5

jobs:
  meta:
    runs-on: retreat-k8s
    outputs:
      version: ${{ steps.v.outputs.version }}
      pkg_version: ${{ steps.v.outputs.pkg_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          if [ "${{ inputs.release }}" = "true" ] && [ "${GITHUB_REF_TYPE}" = tag ]; then
            v=${GITHUB_REF_NAME}
            pkg=${v#v}
          else
            v=$(git describe --tags --always)
            base=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
            pkg=${base#v}_git$(git log -1 --format=%cd --date=format:%Y%m%d%H%M)
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "pkg_version=$pkg" >> "$GITHUB_OUTPUT"
          echo "version $v, package version $pkg"
      - run: ./scripts/check-layout.sh

  lint-go:
    runs-on: retreat-k8s
    container: golang:1.23-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Prepare embedded web directory
        run: mkdir -p internal/server/webdist && touch internal/server/webdist/.gitkeep
      - uses: actions/cache@v4
        with:
          path: |
            /root/go/pkg/mod
            /root/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - name: go vet
        run: go vet ./... && go vet -tags e2e ./test/e2e/ && go vet -tags lanscape_small ./...
      - name: Generated files are up to date
        run: go generate ./internal/fingerprint && git diff --exit-code
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0

  test-go:
    runs-on: retreat-k8s
    container: golang:1.23-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@v4
        with:
          path: |
            /root/go/pkg/mod
            /root/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - name: Unit tests (race)
        run: go test -race -count=1 ./...
      - name: Compile tests for macOS, Windows and FreeBSD
        run: |
          for os in darwin windows freebsd; do
            for p in $(go list ./...); do GOOS=$os go test -c -o /dev/null "$p"; done
            GOOS=$os go vet ./...
          done

  # the store and server suites once more against PostgreSQL (SQLite is covered above)
  test-postgres:
    runs-on: retreat-k8s
    container: golang:1.23-bookworm
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: lanscape
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      LANSCAPE_TEST_POSTGRES: postgres://postgres:lanscape@postgres:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@v4
        with:
          path: |
            /root/go/pkg/mod
            /root/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - run: go test -count=1 ./internal/store/... ./internal/server/...

  # Hosted macOS/Windows runners are optional (docs/decisions/0007-ci-runners.md).
  test-go-hosted:
    if: vars.HOSTED_RUNNERS == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -count=1 ./...

  web:
    runs-on: retreat-k8s
    container: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - uses: actions/cache@v4
        with:
          path: /root/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('web/pnpm-lock.yaml') }}
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: svelte-check
        working-directory: web
        run: pnpm run check
      - name: eslint
        working-directory: web
        run: pnpm run lint
      - name: vitest
        working-directory: web
        run: pnpm run test
      - name: vite build
        working-directory: web
        run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: webdist
          path: internal/server/webdist/
          include-hidden-files: true

  build-full:
    needs: [meta, web]
    runs-on: retreat-k8s
    container: golang:1.23-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/download-artifact@v4
        with:
          name: webdist
          path: internal/server/webdist
      - uses: actions/cache@v4
        with:
          path: |
            /root/go/pkg/mod
            /root/.cache/go-build
          key: go-build-${{ hashFiles('go.sum') }}
      - name: Build all targets with goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --skip=publish ${{ inputs.release && '--parallelism=4' || '--snapshot' }}
      - name: Agents for the OpenWrt packages (lanscape_small, 8 MiB budget)
        shell: bash
        run: ./scripts/build-openwrt-agents.sh out/openwrt-agents "${{ needs.meta.outputs.version }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-agents
          path: out/openwrt-agents/
      - name: Collect
        run: |
          mkdir -p out/packages out/linux-amd64
          cp dist/*.tar.gz dist/*.zip dist/*.deb dist/*.rpm dist/*.apk dist/checksums-full.txt out/packages/
          cp dist/lanscape_linux_amd64_v1/lanscape dist/lanscape-agent_linux_amd64_v1/lanscape-agent out/linux-amd64/
          scripts/docker-context.sh dist out/docker
      - uses: actions/upload-artifact@v4
        with:
          name: full-packages
          path: out/packages/
      - uses: actions/upload-artifact@v4
        with:
          name: full-linux-amd64
          path: out/linux-amd64/
      - uses: actions/upload-artifact@v4
        with:
          name: full-docker-context
          path: out/docker/

  mini:
    needs: meta
    runs-on: retreat-k8s
    container: debian:bookworm
    strategy:
      fail-fast: false
      matrix:
        target: [linux-amd64, linux-386, linux-arm64, linux-armv7, linux-armv6, linux-armv5, linux-mips,
                 linux-mipsle, linux-mips64, linux-mips64le, linux-riscv64, linux-ppc64le, freebsd-amd64]
    # FreeBSD needs a libc that Zig 0.14 does not ship (docs/decisions/0003-mini-toolchain.md)
    continue-on-error: ${{ matrix.target == 'freebsd-amd64' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          apt-get update -qq && apt-get install -y -qq make gzip git xz-utils curl ca-certificates llvm cppcheck > /dev/null
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Unit and property tests
        if: matrix.target == 'linux-amd64'
        run: make -C mini test
      - name: Static analysis
        if: matrix.target == 'linux-amd64'
        run: make -C mini page build/gen/index_html_gz.h && make -C mini lint
      - name: Fuzz (libFuzzer)
        if: matrix.target == 'linux-amd64'
        continue-on-error: true
        run: make -C mini fuzz
      - name: Build
        run: make -C mini TARGET=${{ matrix.target }} VERSION=${{ needs.meta.outputs.version }} all page
      - name: Size check
        run: |
          mkdir -p out
          make -s -C mini TARGET=${{ matrix.target }} VERSION=${{ needs.meta.outputs.version }} size-check | tee out/sizes-${{ matrix.target }}.md
      - name: Collect
        if: always()
        run: |
          mkdir -p out/${{ matrix.target }}
          cp mini/build/${{ matrix.target }}/lsm-* out/${{ matrix.target }}/ 2>/dev/null || true
          cp mini/build/gen/index.html.gz out/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mini-${{ matrix.target }}
          path: out/
          if-no-files-found: ignore

  mini-sizes:
    needs: mini
    runs-on: retreat-k8s
    container: debian:bookworm-slim
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mini-*
          merge-multiple: true
      - name: Size table
        run: |
          {
            echo "## Lanscape Mini sizes"
            echo
            echo "| Target | File | Bytes | Budget | Status |"
            echo "|---|---|---|---|---|"
            cat sizes-*.md | grep '^| linux' | sort -u
            cat sizes-*.md | grep '^| freebsd' | sort -u || true
          } | tee sizes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: mini-sizes
          path: sizes.md

  e2e:
    needs: [mini, build-full]
    runs-on: retreat-k8s
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mini-linux-amd64
          path: dist/mini
      - uses: actions/download-artifact@v4
        with:
          name: full-linux-amd64
          path: dist/full
      - name: Network-namespace e2e and UI smoke (privileged container)
        run: |
          chmod +x dist/mini/linux-amd64/* dist/full/*
          scripts/docker-pull.sh mcr.microsoft.com/playwright:v1.56.1-noble
          docker run --rm --privileged -v "$PWD:$PWD" -w "$PWD" \
            -e LSM_BIN="$PWD/dist/mini/linux-amd64" -e LANSCAPE_BIN="$PWD/dist/full" \
            mcr.microsoft.com/playwright:v1.56.1-noble test/e2e/ci.sh all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            test/e2e/out/
            test/e2e/screenshots/

  openwrt:
    needs: [meta, mini, build-full]
    runs-on: retreat-k8s
    strategy:
      fail-fast: false
      matrix:
        branch: ["24.10", "25.12"]
        target: [x86-64, mediatek-filogic, ramips-mt7621, ath79-generic, ipq40xx-generic, bcm27xx-bcm2711]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mini-linux-*
          path: bins
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: openwrt-agents
          path: bins
      - name: Build packages in the OpenWrt SDK
        run: |
          case "${{ matrix.branch }}" in 24.10) v=$OPENWRT_24 ;; *) v=$OPENWRT_25 ;; esac
          mkdir -p out && chmod -R a+rwX out bins && chmod a+x bins/*/*
          scripts/docker-pull.sh "openwrt/sdk:${{ matrix.target }}-$v"
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/bins:/bins:ro" -v "$PWD/out:/out" \
            "openwrt/sdk:${{ matrix.target }}-$v" \
            /src/packaging/openwrt/sdk-build.sh /src /bins /out "${{ needs.meta.outputs.pkg_version }}" \
            lsm-agent lsm-server lanscape-agent luci-app-lanscape
          echo "ARCH=$(cat out/ARCH)" >> "$GITHUB_ENV"
      - name: Check Mini package size (≤ 64 KiB)
        run: |
          for f in out/lsm-*; do
            s=$(wc -c < "$f"); echo "$f $s"
            [ "$s" -le 65536 ] || { echo "$f exceeds 64 KiB"; exit 1; }
          done
      - name: Install smoke test in OpenWrt rootfs
        if: matrix.target == 'x86-64'
        run: |
          case "${{ matrix.branch }}" in
            24.10) v=$OPENWRT_24; inst="opkg install /pkgs/lsm-agent_*.ipk /pkgs/lsm-server_*.ipk /pkgs/lanscape-agent_*.ipk" ;;
            *) v=$OPENWRT_25; inst="apk add --allow-untrusted /pkgs/lsm-agent-*.apk /pkgs/lsm-server-*.apk /pkgs/lanscape-agent-*.apk" ;; esac
          scripts/docker-pull.sh "openwrt/rootfs:x86-64-$v"
          docker run --rm -v "$PWD/out:/pkgs:ro" "openwrt/rootfs:x86-64-$v" /bin/sh -c "
            mkdir -p /var/lock /var/run && $inst && lsm-agent -V && lsm-server -V && lanscape-agent version &&
            uci -q get lsm.agent.exclude && uci -q get lsm.server.listen && uci -q get lanscape.agent.exclude"
      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ matrix.branch }}-${{ env.ARCH }}
          path: out/

  docker:
    needs: [meta, mini, build-full]
    runs-on: retreat-k8s
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mini-linux-*
          path: ctx
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: full-docker-context
          path: ctx-full
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' || inputs.release
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
        if: inputs.release
      - name: Tags
        id: tags
        run: |
          v=${{ needs.meta.outputs.version }}
          for img in lsm-agent lsm-server lanscape lanscape-agent; do
            base=ghcr.io/${GITHUB_REPOSITORY_OWNER}/$img
            if [ "${{ inputs.release }}" = true ]; then
              mm=$(echo "${v#v}" | cut -d. -f1-2)
              t="$base:$v,$base:$mm,$base:latest"
            else
              t="$base:edge"
            fi
            echo "$(echo $img | tr - _)=$t" >> "$GITHUB_OUTPUT"
          done
      - name: Build lsm-agent
        id: agent
        uses: docker/build-push-action@v6
        with:
          context: ctx
          file: packaging/docker/lsm-agent.Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6,linux/386,linux/riscv64,linux/ppc64le
          push: ${{ github.event_name == 'push' || inputs.release }}
          tags: ${{ steps.tags.outputs.lsm_agent }}
      - name: Build lsm-server
        id: server
        uses: docker/build-push-action@v6
        with:
          context: ctx
          file: packaging/docker/lsm-server.Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6,linux/386,linux/riscv64,linux/ppc64le
          push: ${{ github.event_name == 'push' || inputs.release }}
          tags: ${{ steps.tags.outputs.lsm_server }}
      - name: Build lanscape
        id: full
        uses: docker/build-push-action@v6
        with:
          context: ctx-full
          file: packaging/docker/lanscape.Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name == 'push' || inputs.release }}
          tags: ${{ steps.tags.outputs.lanscape }}
      - name: Build lanscape-agent
        id: fullagent
        uses: docker/build-push-action@v6
        with:
          context: ctx-full
          file: packaging/docker/lanscape-agent.Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          push: ${{ github.event_name == 'push' || inputs.release }}
          tags: ${{ steps.tags.outputs.lanscape_agent }}
      - name: Sign images
        if: inputs.release
        run: |
          o=ghcr.io/${GITHUB_REPOSITORY_OWNER}
          cosign sign --yes "$o/lsm-agent@${{ steps.agent.outputs.digest }}"
          cosign sign --yes "$o/lsm-server@${{ steps.server.outputs.digest }}"
          cosign sign --yes "$o/lanscape@${{ steps.full.outputs.digest }}"
          cosign sign --yes "$o/lanscape-agent@${{ steps.fullagent.outputs.digest }}"

  openapi:
    runs-on: retreat-k8s
    container: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Lint OpenAPI descriptions
        run: npx --yes @redocly/cli@1 lint docs/openapi*.yaml

  k8s:
    runs-on: retreat-k8s
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifests with kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary deploy/k8s/mini/*.yaml
      - name: Lint and validate the Helm chart
        run: |
          curl -fsSL https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz | tar -xz linux-amd64/helm
          ./linux-amd64/helm lint deploy/helm/lanscape --strict --set agent.token=lsr_x
          for set in "" "agent.token=lsr_x,agent.podNetwork.enabled=true,server.ingress.enabled=true,server.ingress.tls=true,server.adminPassword=x"; do
            ./linux-amd64/helm template t deploy/helm/lanscape ${set:+--set "$set"} | ./kubeconform -strict -summary -
          done
      - name: Validate compose files
        run: |
          for f in deploy/compose/*.yaml; do
            docker run --rm -v "$PWD:$PWD" -w "$PWD" -e LSM_TOKEN=x -e LANSCAPE_TOKEN=x -e LANSCAPE_SERVER=x docker:27-cli \
              docker compose -f "$f" config -q
          done
