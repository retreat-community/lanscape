name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      release: true
    secrets: inherit

  release:
    needs: ci
    runs-on: retreat-k8s
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: mini-*
          path: mini
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: openwrt-*
          path: openwrt
      - uses: actions/download-artifact@v4
        with:
          name: full-packages
          path: full
      - uses: sigstore/cosign-installer@v3
      - name: Install nfpm
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.43.1/nfpm_2.43.1_Linux_x86_64.tar.gz | tar -xz -C "$HOME/bin" nfpm
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Assemble assets
        run: |
          mkdir -p assets
          scripts/package-mini.sh mini "$GITHUB_REF_NAME" assets
          scripts/package-mini-nfpm.sh mini "$GITHUB_REF_NAME" assets
          cp full/* assets/
          rm -f assets/checksums-full.txt
          # OpenWrt packages: prefix with branch and arch (apk file names carry no arch)
          for d in openwrt/openwrt-*; do
            id=$(basename "$d")                      # openwrt-<branch>-<arch>
            for f in "$d"/*.ipk "$d"/*.apk; do
              [ -f "$f" ] && cp "$f" "assets/${id}_$(basename "$f")"
            done
            tar -C "$d" -czf "assets/${id}-feed.tar.gz" .
          done
          cd assets && sha256sum * > checksums.txt
      - name: Sign checksums
        run: cosign sign-blob --yes --bundle assets/checksums.txt.sigstore.json assets/checksums.txt
      - name: Release notes
        run: |
          {
            scripts/changelog.sh "$GITHUB_REF_NAME"
            echo
            cat mini/sizes.md 2>/dev/null || true
            echo
            echo "Verify: \`cosign verify-blob --bundle checksums.txt.sigstore.json" \
                 "--certificate-identity-regexp 'https://github.com/${GITHUB_REPOSITORY}/' " \
                 "--certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt\`"
          } > notes.md
          cat notes.md
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
          files: assets/*

  pages:
    needs: release
    uses: ./.github/workflows/pages.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
