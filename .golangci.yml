version: "2"
run:
  timeout: 10m
  build-tags: [e2e]
linters:
  default: standard
  enable:
    - bodyclose
    - gosec
    - misspell
    - nilerr
    - unconvert
    - errorlint
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (net.Conn).Close
        - (net.Listener).Close
        - (net.PacketConn).Close
        - (*net.UDPConn).Close
        - (*net.conn).Close
        - (*crypto/tls.Conn).Close
        - (*os.File).Close
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - (*github.com/retreat-community/lanscape/internal/store.Store).Close
        - (*github.com/coder/websocket.Conn).CloseNow
        - golang.org/x/sys/unix.Close
    gosec:
      excludes:
        - G304 # file paths come from configuration, not from requests
        - G115 # integer conversions are range-checked where input is external
        - G104 # errors are handled explicitly or deliberately ignored with _
formatters:
  enable:
    - gofmt
