{{- if or .Values.agent.token .Values.agent.existingTokenSecret }}
{{- $name := include "lanscape.fullname" . }}
{{- if not .Values.agent.existingTokenSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-agent
  labels: {{- include "lanscape.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.agent.token | quote }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-agent
  labels: {{- include "lanscape.labels" . | nindent 4 }}
{{- if .Values.agent.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-agent
  labels: {{- include "lanscape.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [services, persistentvolumeclaims, pods, nodes]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-agent
  labels: {{- include "lanscape.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-agent
subjects:
  - kind: ServiceAccount
    name: {{ $name }}-agent
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- range $mode := list "host" "pod" }}
{{- $enabled := ternary $.Values.agent.hostNetwork.enabled $.Values.agent.podNetwork.enabled (eq $mode "host") }}
{{- if $enabled }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $name }}-agent-{{ $mode }}
  labels: {{- include "lanscape.labels" $ | nindent 4 }}
    app.kubernetes.io/component: agent-{{ $mode }}
spec:
  selector:
    matchLabels: {{- include "lanscape.selector" $ | nindent 6 }}
      app.kubernetes.io/component: agent-{{ $mode }}
  updateStrategy:
    rollingUpdate: {maxUnavailable: 25%}
  template:
    metadata:
      labels: {{- include "lanscape.selector" $ | nindent 8 }}
        app.kubernetes.io/component: agent-{{ $mode }}
    spec:
      serviceAccountName: {{ $name }}-agent
      {{- if eq $mode "host" }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.agent.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: agent
          image: "{{ $.Values.image.registry }}/lanscape-agent:{{ include "lanscape.tag" $ }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: LANSCAPE_NAME
              value: {{ if eq $mode "host" }}"$(NODE_NAME)"{{ else }}"$(NODE_NAME)-pod"{{ end }}
            - {name: LANSCAPE_SERVER, value: {{ include "lanscape.gateway" $ | quote }}}
            - name: LANSCAPE_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ include "lanscape.tokenSecret" $ }}, key: token}
            {{- with $.Values.agent.caFingerprint }}
            - {name: LANSCAPE_CA_FINGERPRINT, value: {{ . | quote }}}
            {{- end }}
            - {name: LANSCAPE_EXCLUDE, value: {{ $.Values.agent.exclude | quote }}}
            - {name: LANSCAPE_DATA_DIR, value: /var/lib/lanscape-agent}
            # Kubernetes objects are reported once per cluster: by the node-network agents
            - {name: LANSCAPE_DISCOVER, value: {{ if eq $mode "host" }}{{ $.Values.agent.discover | quote }}{{ else }}"none"{{ end }}}
          securityContext:
            capabilities:
              add: [NET_RAW, NET_ADMIN]
          resources: {{- toYaml $.Values.agent.resources | nindent 12 }}
          volumeMounts:
            - {name: state, mountPath: /var/lib/lanscape-agent}
      volumes:
        # the agent certificate survives pod restarts on the same node
        - name: state
          hostPath:
            path: /var/lib/lanscape-agent/{{ $.Release.Name }}-{{ $mode }}
            type: DirectoryOrCreate
      {{- with $.Values.agent.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.agent.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
{{- end }}
