openapi: 3.0.3
info:
  title: Lanscape API
  version: "1"
  description: |
    HTTP API of the Lanscape server (port 8080). Authenticate with the session cookie from
    `POST /api/v1/auth/login` or with an API token (`Authorization: Bearer lsk_...`).
    State-changing requests must use `Content-Type: application/json`.
    Roles: viewer < operator (runs, services, monitors, incidents) < admin.
  license:
    name: GPL-3.0-or-later
    url: https://www.gnu.org/licenses/gpl-3.0.html
servers:
  - url: http://localhost:8080
security:
  - cookie: []
  - bearer: []
tags:
  - name: auth
    description: Login, sessions and two-factor authentication
  - name: users
    description: Panel accounts and API tokens
  - name: agents
    description: Agents, registration tokens and install commands
  - name: network
    description: Segments, IPAM, anomalies and the map
  - name: runs
    description: Network test runs and schedules
  - name: discovery
    description: Found queue, auto-add rules and the change feed
  - name: services
    description: Service catalog, dashboard and search
  - name: monitors
    description: Availability monitors, incidents and maintenance windows
  - name: notifications
    description: Notification channels
  - name: status
    description: Public status pages
  - name: settings
    description: Server settings and audit log
  - name: system
    description: Health, metrics and events
paths:
  /healthz:
    get:
      tags: [system]
      operationId: health
      summary: Health
      security: []
      responses:
        "200": {description: ok, content: {text/plain: {}}}
  /metrics:
    get:
      tags: [system]
      operationId: metrics
      summary: Metrics
      description: Prometheus metrics; requires `Bearer <metrics token>` when configured.
      security: [{}, {metricsToken: []}]
      responses:
        "200": {description: metrics, content: {text/plain: {}}}
        "401": {$ref: "#/components/responses/Error"}
  /api/v1/setup:
    get:
      tags: [auth]
      operationId: setupState
      summary: Setup state
      security: []
      responses:
        "200":
          description: whether the first administrator must be created
          content:
            application/json:
              schema:
                type: object
                properties:
                  needs_setup: {type: boolean}
                  version: {type: string}
    post:
      tags: [auth]
      operationId: setup
      summary: Setup
      security: []
      requestBody: {$ref: "#/components/requestBodies/Credentials"}
      responses:
        "200": {$ref: "#/components/responses/User"}
        "400": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Login
      security: []
      requestBody: {$ref: "#/components/requestBodies/Credentials"}
      responses:
        "200": {$ref: "#/components/responses/User"}
        "401": {$ref: "#/components/responses/Error"}
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Logout
      responses:
        "200": {$ref: "#/components/responses/Ok"}
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: me
      summary: Me
      responses:
        "200":
          description: current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: {$ref: "#/components/schemas/User"}
                  role: {type: string}
                  version: {type: string}
        "401": {$ref: "#/components/responses/Error"}
  /api/v1/auth/password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old, new]
              properties:
                old: {type: string}
                new: {type: string, minLength: 10}
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/auth/oidc:
    get:
      tags: [auth]
      operationId: oidcInfo
      summary: Whether single sign-on is configured
      security: []
      responses:
        "200":
          description: sign-in button
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: {type: boolean}
                  name: {type: string}
  /api/v1/auth/oidc/login:
    get:
      tags: [auth]
      operationId: oidcLogin
      summary: Start OpenID Connect sign-in (redirects to the provider)
      security: []
      responses:
        "302": {description: redirect to the provider}
        "404": {description: single sign-on is not configured}
  /api/v1/auth/oidc/callback:
    get:
      tags: [auth]
      operationId: oidcCallback
      summary: OpenID Connect redirect URL (sets the session cookie)
      security: []
      parameters:
        - {name: code, in: query, schema: {type: string}}
        - {name: state, in: query, schema: {type: string}}
      responses:
        "302": {description: "to the panel, or to /#/login?error=… on failure"}
  /api/v1/auth/totp:
    post:
      tags: [auth]
      operationId: totpStart
      summary: Totp start
      responses:
        "200":
          description: new secret for enrolment
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: {type: string}
                  url: {type: string}
    put:
      tags: [auth]
      operationId: totpConfirm
      summary: Totp confirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                secret: {type: string}
                code: {type: string}
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "400": {$ref: "#/components/responses/Error"}
    delete:
      tags: [auth]
      operationId: totpDisable
      summary: Totp disable
      responses:
        "200": {$ref: "#/components/responses/Ok"}
  /api/v1/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users
      responses:
        "200":
          description: users (admin)
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/User"}}
        "403": {$ref: "#/components/responses/Error"}
    post:
      tags: [users]
      operationId: createUser
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username: {type: string}
                password: {type: string, minLength: 10}
                role: {$ref: "#/components/schemas/Role"}
      responses:
        "201": {$ref: "#/components/responses/User"}
        "400": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/users/{id}:
    parameters: [{$ref: "#/components/parameters/IntID"}]
    patch:
      tags: [users]
      operationId: updateUser
      summary: Update user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: {$ref: "#/components/schemas/Role"}
                password: {type: string}
                disabled: {type: boolean}
                reset_totp: {type: boolean}
      responses:
        "200": {$ref: "#/components/responses/User"}
        "404": {$ref: "#/components/responses/Error"}
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Delete user
      responses:
        "204": {description: deleted}
        "400": {$ref: "#/components/responses/Error"}
  /api/v1/tokens:
    get:
      tags: [users]
      operationId: listTokens
      summary: List tokens
      parameters:
        - {name: all, in: query, schema: {type: string, enum: ["1"]}, description: all users (admin)}
      responses:
        "200":
          description: API tokens
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/APIToken"}}
    post:
      tags: [users]
      operationId: createToken
      summary: Create token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
                role: {$ref: "#/components/schemas/Role"}
                expires_in_s: {type: integer}
      responses:
        "201": {$ref: "#/components/responses/Secret"}
        "400": {$ref: "#/components/responses/Error"}
  /api/v1/tokens/{id}:
    parameters: [{$ref: "#/components/parameters/IntID"}]
    delete:
      tags: [users]
      operationId: deleteToken
      summary: Delete token
      responses:
        "204": {description: deleted}
  /api/v1/agent-tokens:
    get:
      tags: [agents]
      operationId: listAgentTokens
      summary: List agent tokens
      responses:
        "200":
          description: registration tokens (admin)
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/AgentToken"}}
    post:
      tags: [agents]
      operationId: createAgentToken
      summary: Create agent token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                labels: {type: object, additionalProperties: {type: string}}
                reusable: {type: boolean}
                expires_in_s: {type: integer}
      responses:
        "201":
          description: token (shown once) and install commands
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: integer}
                  token: {type: string}
                  install: {type: object, additionalProperties: {type: string}}
  /api/v1/agent-tokens/{id}:
    parameters: [{$ref: "#/components/parameters/IntID"}]
    delete:
      tags: [agents]
      operationId: deleteAgentToken
      summary: Delete agent token
      responses:
        "204": {description: deleted}
  /api/v1/install:
    get:
      tags: [agents]
      operationId: installCommands
      summary: Install commands
      responses:
        "200":
          description: gateway address, CA fingerprint and install command templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  gateway: {type: string}
                  ca_fingerprint: {type: string}
                  commands: {type: object, additionalProperties: {type: string}}
  /api/v1/agents:
    get:
      tags: [agents]
      operationId: listAgents
      summary: List agents
      responses:
        "200":
          description: agents with live state and inventory
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Agent"}}
  /api/v1/agents/{id}:
    parameters: [{$ref: "#/components/parameters/StrID"}]
    get:
      tags: [agents]
      operationId: getAgent
      summary: Get agent
      responses:
        "200":
          description: agent
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Agent"}
        "404": {$ref: "#/components/responses/Error"}
    patch:
      tags: [agents]
      operationId: updateAgent
      summary: Update agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                labels: {type: object, additionalProperties: {type: string}}
      responses:
        "200": {description: updated, content: {application/json: {schema: {type: object}}}}
        "404": {$ref: "#/components/responses/Error"}
    delete:
      tags: [agents]
      operationId: deleteAgent
      summary: Delete agent
      description: Removes the agent; its certificate is no longer accepted.
      responses:
        "204": {description: deleted}
  /api/v1/segments:
    get:
      tags: [network]
      operationId: listSegments
      summary: List segments
      responses:
        "200":
          description: current segments
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Segment"}}
  /api/v1/segments/{id}:
    parameters: [{$ref: "#/components/parameters/StrID"}]
    put:
      tags: [network]
      operationId: setSegment
      summary: Set segment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                expected_mbps: {type: integer, minimum: 0}
      responses:
        "200": {description: saved, content: {application/json: {schema: {type: object}}}}
        "400": {$ref: "#/components/responses/Error"}
  /api/v1/ipam:
    get:
      tags: [network]
      operationId: ipam
      summary: Ipam
      responses:
        "200":
          description: address usage per segment
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/IPAM"}}
  /api/v1/anomalies:
    get:
      tags: [network]
      operationId: anomalies
      summary: Anomalies
      responses:
        "200":
          description: duplicate IP/MAC, subnet on several VLANs, missing link, new MACs
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Anomaly"}}
  /api/v1/map:
    get:
      tags: [network]
      operationId: map
      summary: Map
      responses:
        "200":
          description: map graph with verdicts of the last full run
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MapGraph"}
  /api/v1/devices/discovered:
    get:
      tags: [network]
      operationId: discoveredDevices
      summary: Discovered devices
      description: Hosts without an agent from ARP/NDP neighbour tables, OpenWrt DHCP leases and Wi-Fi clients, mDNS/DNS-SD and SSDP, merged by address, with the MAC vendor.
      responses:
        "200":
          description: devices
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    ip: {type: string}
                    mac: {type: string}
                    vendor: {type: string}
                    name: {type: string}
                    type: {type: string, enum: [printer, media, iot, nas, computer, phone, router, ap, device]}
                    model: {type: string}
                    url: {type: string}
                    services: {type: array, items: {type: string}}
                    sources: {type: array, items: {type: string}}
                    seen_by: {type: array, items: {type: string}}
                    wifi: {type: string, description: band and signal on an OpenWrt access point}
                    ports: {type: string, description: open TCP ports from the last scan}
  /api/v1/paths/history:
    get:
      tags: [network]
      operationId: pathHistory
      summary: Path history
      description: Measurements of the paths between two nodes in the newest full and reachability runs, oldest first.
      parameters:
        - {name: src, in: query, required: true, schema: {type: string}}
        - {name: dst, in: query, required: true, schema: {type: string}}
        - {name: seg, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, default: 30, maximum: 200}}
      responses:
        "200":
          description: measurements
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    run_id: {type: integer}
                    finished: {type: integer}
                    src_if: {type: string}
                    dst_if: {type: string}
                    best_bps: {type: integer}
                    rtt_us: {type: integer}
                    verdict: {type: string}
                    status: {type: string}
        "400": {$ref: "#/components/responses/Error"}
  /api/v1/runs:
    get:
      tags: [runs]
      operationId: listRuns
      summary: List runs
      parameters:
        - {name: limit, in: query, schema: {type: integer, maximum: 500}}
      responses:
        "200":
          description: runs, newest first
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/RunSummary"}}
    post:
      tags: [runs]
      operationId: startRun
      summary: Start run
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RunOptions"}
      responses:
        "202":
          description: started
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: integer}
        "400": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/runs/estimate:
    get:
      tags: [runs]
      operationId: estimateRun
      summary: Estimate run
      parameters:
        - {name: kind, in: query, schema: {type: string}}
        - {name: udp, in: query, schema: {type: string, enum: ["0", "1"]}}
        - {name: bidir, in: query, schema: {type: string, enum: ["0", "1"]}}
      responses:
        "200":
          description: number of paths and expected duration
          content:
            application/json:
              schema:
                type: object
                properties:
                  paths: {type: integer}
                  seconds: {type: integer}
  /api/v1/runs/active:
    get:
      tags: [runs]
      operationId: activeRun
      summary: Active run
      responses:
        "200":
          description: progress of the running run or null
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Progress"}
  /api/v1/runs/last:
    get:
      tags: [runs]
      operationId: lastRun
      summary: Last run
      parameters:
        - {name: kind, in: query, schema: {type: string}}
      responses:
        "200":
          description: last finished run or null
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Report"}
  /api/v1/runs/{id}:
    parameters: [{$ref: "#/components/parameters/IntID"}]
    get:
      tags: [runs]
      operationId: getRun
      summary: Get run
      responses:
        "200":
          description: run report
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Report"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/runs/cancel:
    post:
      tags: [runs]
      operationId: cancelRun
      summary: Cancel run
      responses:
        "200":
          description: whether a run was cancelled (partial results are kept)
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelled: {type: boolean}
  /api/v1/schedules:
    get:
      tags: [runs]
      operationId: listSchedules
      summary: List schedules
      responses:
        "200":
          description: schedules
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Schedule"}}
    post:
      tags: [runs]
      operationId: createSchedule
      summary: Create schedule
      requestBody: {$ref: "#/components/requestBodies/Schedule"}
      responses:
        "200": {$ref: "#/components/responses/Schedule"}
        "400": {$ref: "#/components/responses/Error"}
  /api/v1/schedules/{id}:
    parameters: [{$ref: "#/components/parameters/IntID"}]
    put:
      tags: [runs]
      operationId: updateSchedule
      summary: Update schedule
      requestBody: {$ref: "#/components/requestBodies/Schedule"}
      responses:
        "200": {$ref: "#/components/responses/Schedule"}
        "400": {$ref: "#/components/responses/Error"}
    delete:
      tags: [runs]
      operationId: deleteSchedule
      summary: Delete schedule
      responses:
        "204": {description: deleted}
  /api/v1/settings:
    get:
      tags: [settings]
      operationId: getSettings
      summary: Get settings
      responses:
        "200":
          description: settings (secrets masked)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Settings"}
    put:
      tags: [settings]
      operationId: saveSettings
      summary: Save settings
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Settings"}
      responses:
        "200":
          description: saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Settings"}
        "400": {$ref: "#/components/responses/Error"}
  /api/v1/audit:
    get:
      tags: [settings]
      operationId: audit
      summary: Audit
      responses:
        "200":
          description: latest audit entries (admin)
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/AuditEntry"}}
  /api/v1/events:
    get:
      tags: [system]
      operationId: events
      summary: Events
      description: "Server-sent events: run.started, run.progress, run.done, agent, inventory, discovery, change, services, monitor, incident, maintenance"
      responses:
        "200": {description: event stream, content: {text/event-stream: {}}}
  /api/push/{token}:
    parameters:
      - {name: token, in: path, required: true, schema: {type: string}}
      - {name: status, in: query, description: "up (default) or down", schema: {type: string, enum: [up, down]}}
      - {name: msg, in: query, schema: {type: string, maxLength: 500}}
      - {name: ping, in: query, description: duration in ms reported as response time, schema: {type: number}}
    get:
      tags: [monitors]
      operationId: pushHeartbeat
      summary: Heartbeat push
      description: Called by cron jobs and scripts for heartbeat monitors; the secret token authenticates the call.
      security: []
      responses:
        "200": {description: recorded}
        "404": {$ref: "#/components/responses/Error"}
    post:
      tags: [monitors]
      operationId: pushHeartbeatPost
      summary: Heartbeat push (POST)
      security: []
      responses:
        "200": {description: recorded}
        "404": {$ref: "#/components/responses/Error"}
  /status/{slug}:
    get:
      tags: [status]
      operationId: statusPageHTML
      summary: Status page (HTML)
      description: Public pages need no authentication; link-only pages need the page token in `t`. Custom domains serve the page at `/`.
      security: []
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
        - {name: t, in: query, schema: {type: string}}
      responses:
        "200": {description: page, content: {text/html: {}}}
        "404": {description: unknown page or missing token}
  /api/status/{slug}:
    get:
      tags: [status]
      operationId: statusPageJSON
      summary: Status page (JSON)
      security: []
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
        - {name: t, in: query, schema: {type: string}}
      responses:
        "200":
          description: overall state, groups with 90-day history, incidents of 7 days and planned maintenance
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/status-pages:
    get:
      tags: [status]
      operationId: listStatusPages
      summary: Status pages
      responses:
        "200":
          description: pages
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/StatusPage"}}
    post:
      tags: [status]
      operationId: createStatusPage
      summary: Create status page
      requestBody: {$ref: "#/components/requestBodies/StatusPage"}
      responses:
        "200": {$ref: "#/components/responses/StatusPage"}
        "400": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/status-pages/{id}:
    parameters: [{$ref: "#/components/parameters/IntID"}]
    put:
      tags: [status]
      operationId: updateStatusPage
      summary: Update status page
      requestBody: {$ref: "#/components/requestBodies/StatusPage"}
      responses:
        "200": {$ref: "#/components/responses/StatusPage"}
        "400": {$ref: "#/components/responses/Error"}
    delete:
      tags: [status]
      operationId: deleteStatusPage
      summary: Delete status page
      responses:
        "204": {description: deleted}
  /api/v1/found:
    get:
      tags: [discovery]
      operationId: listFound
      summary: Found queue
      description: Discovered services merged into cards, with their triage status.
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [new, added, ignored, hidden]}}
      responses:
        "200":
          description: cards
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/FoundCard"}}
  /api/v1/found/add:
    post:
      tags: [discovery]
      operationId: addFound
      summary: Add a found service
      description: Creates a service from a card, optionally with the recommended monitor and a dashboard tile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: {type: string}
                name: {type: string}
                group: {type: string}
                monitor: {type: boolean}
                tile: {type: boolean}
      responses:
        "201": {$ref: "#/components/responses/Service"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/found/state:
    post:
      tags: [discovery]
      operationId: setFoundState
      summary: Ignore, hide or restore a card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, status]
              properties:
                key: {type: string}
                status: {type: string, enum: [new, ignored, hidden]}
      responses:
        "200": {description: updated}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/discovery/rescan:
    post:
      tags: [discovery]
      operationId: rescan
      summary: Rescan now
      description: Asks all connected agents for a fresh discovery report.
      responses:
        "200":
          description: number of agents asked
          content:
            application/json:
              schema: {type: object, properties: {agents: {type: integer}}}
  /api/v1/discovery/scan:
    post:
      tags: [discovery]
      operationId: scan
      summary: Port scan
      description: Starts an explicit, rate-limited TCP scan of subnets from one agent; results appear in the discovered devices.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent, cidrs]
              properties:
                agent: {type: string}
                cidrs: {type: array, items: {type: string}, description: "IPv4 subnets or addresses, at most max_hosts addresses in total"}
                ports: {type: array, items: {type: integer}, description: default popular service ports}
                rate_per_s: {type: integer, default: 200, maximum: 2000}
                timeout_ms: {type: integer, default: 700}
                max_hosts: {type: integer, default: 1024}
      responses:
        "202": {description: started}
        "400": {$ref: "#/components/responses/Error"}
  /api/v1/push/key:
    get:
      tags: [notifications]
      operationId: pushKey
      summary: Web Push application server key
      responses:
        "200":
          description: VAPID public key (base64url, uncompressed P-256 point)
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: {type: string}
  /api/v1/push/subscribe:
    post:
      tags: [notifications]
      operationId: pushSubscribe
      summary: Register this browser for incident notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: PushSubscription.toJSON()
              required: [endpoint, keys]
              properties:
                endpoint: {type: string, format: uri}
                keys:
                  type: object
                  properties:
                    p256dh: {type: string}
                    auth: {type: string}
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "400": {$ref: "#/components/responses/Error"}
  /api/v1/push/unsubscribe:
    post:
      tags: [notifications]
      operationId: pushUnsubscribe
      summary: Remove a browser subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint: {type: string}
      responses:
        "204": {description: removed}
  /api/v1/push/test:
    post:
      tags: [notifications]
      operationId: pushTest
      summary: Send a test notification to the current user's browsers
      responses:
        "200":
          description: number of browsers reached
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: {type: integer}
  /api/v1/actions/wol:
    post:
      tags: [discovery]
      operationId: actionWake
      summary: Send Wake-on-LAN to a device (operator; audited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mac]
              properties:
                mac: {type: string}
                ip: {type: string, description: last known address; picks agents on its subnet}
                agent: {type: string, description: send from this agent only}
      responses:
        "200": {$ref: "#/components/responses/ActionResult"}
        "400": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/actions/restart:
    post:
      tags: [discovery]
      operationId: actionRestart
      summary: Restart a discovered container, workload or VM/CT (operator; audited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent, source, key]
              properties:
                agent: {type: string}
                source: {type: string, enum: [docker, k8s, proxmox]}
                key: {type: string, example: container/gitea}
      responses:
        "200": {$ref: "#/components/responses/ActionResult"}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/config:
    get:
      tags: [settings]
      operationId: exportConfig
      summary: Export the declarative configuration (admin)
      parameters:
        - {name: format, in: query, schema: {type: string, enum: [yaml, json]}}
      responses:
        "200":
          description: configuration file (apiVersion lanscape/v1)
          content:
            application/yaml:
              schema: {$ref: "#/components/schemas/ConfigFile"}
            application/json:
              schema: {$ref: "#/components/schemas/ConfigFile"}
    post:
      tags: [settings]
      operationId: applyConfig
      summary: Apply a configuration file (admin; audited)
      parameters:
        - {name: dry_run, in: query, schema: {type: boolean}}
        - {name: prune, in: query, schema: {type: boolean}}
      requestBody:
        required: true
        content:
          application/yaml:
            schema: {$ref: "#/components/schemas/ConfigFile"}
      responses:
        "200": {$ref: "#/components/responses/ConfigPlan"}
        "400": {$ref: "#/components/responses/ConfigPlan"}
  /api/v1/internet:
    get:
      tags: [network]
      operationId: internetHistory
      summary: Internet exits with public address, speed history and outages
      parameters:
        - {name: days, in: query, schema: {type: integer, default: 30, maximum: 366}}
      responses:
        "200":
          description: one entry per observation point and gateway interface
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    point: {type: string}
                    name: {type: string}
                    dev: {type: string}
                    gateway: {type: string}
                    last: {type: object, additionalProperties: true}
                    speeds: {type: array, items: {type: object, properties: {ts: {type: integer}, mbps: {type: number}}}}
                    outages: {type: array, items: {type: object, properties: {from: {type: integer}, to: {type: integer}, error: {type: string}}}}
                    checks: {type: integer}
                    failures: {type: integer}
  /api/v1/internet/run:
    post:
      tags: [network]
      operationId: runInternet
      summary: Run the Internet test now from the configured points (operator)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                speed: {type: boolean, description: also measure the download speed}
      responses:
        "202": {description: started}
  /api/v1/import/dashboard:
    post:
      tags: [discovery]
      operationId: importTiles
      summary: Create dashboard tiles from a Homepage, Homer or Dashy configuration (admin)
      requestBody:
        required: true
        content:
          application/yaml:
            schema: {type: string, description: "services.yaml, config.yml or conf.yml"}
      responses:
        "200":
          description: result
          content:
            application/json:
              schema:
                type: object
                properties:
                  format: {type: string, enum: [homepage, homer, dashy]}
                  created: {type: integer}
                  skipped: {type: array, items: {type: string}}
        "400": {$ref: "#/components/responses/Error"}
  /api/v1/import/uptime-kuma:
    post:
      tags: [discovery]
      operationId: importUptimeKuma
      summary: Import Uptime Kuma monitors
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, description: Uptime Kuma backup file (monitorList is used), additionalProperties: true}
      responses:
        "200":
          description: result
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: {type: integer}
                  skipped: {type: array, items: {type: string}}
        "400": {$ref: "#/components/responses/Error"}
  /api/v1/import/prometheus:
    post:
      tags: [discovery]
      operationId: importPrometheus
      summary: Import Prometheus targets
      description: Active scrape targets appear in the found queue.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [url], properties: {url: {type: string}}}
      responses:
        "200": {description: imported, content: {application/json: {schema: {type: object, properties: {items: {type: integer}}}}}}
        "502": {$ref: "#/components/responses/Error"}
  /api/v1/import/home-assistant:
    post:
      tags: [discovery]
      operationId: importHomeAssistant
      summary: Import Home Assistant
      description: Home Assistant itself goes to the found queue, entities with an IP address to the discovered devices.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [url, token], properties: {url: {type: string}, token: {type: string}}}
      responses:
        "200": {description: imported, content: {application/json: {schema: {type: object, properties: {items: {type: integer}}}}}}
        "502": {$ref: "#/components/responses/Error"}
  /api/v1/discovery/rules:
    get:
      tags: [discovery]
      operationId: getRules
      summary: Auto-add rules
      responses:
        "200":
          description: rules
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Rule"}}
    put:
      tags: [discovery]
      operationId: saveRules
      summary: Save auto-add rules
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: array, items: {$ref: "#/components/schemas/Rule"}}
      responses:
        "200": {description: saved}
        "400": {$ref: "#/components/responses/Error"}
  /api/v1/services:
    get:
      tags: [services]
      operationId: listServices
      summary: Services
      responses:
        "200":
          description: services with live status; url is the smart link for the client
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/ServiceView"}}
    post:
      tags: [services]
      operationId: createService
      summary: Create service
      requestBody: {$ref: "#/components/requestBodies/Service"}
      responses:
        "200": {$ref: "#/components/responses/Service"}
        "400": {$ref: "#/components/responses/Error"}
  /api/v1/services/order:
    put:
      tags: [services]
      operationId: orderServices
      summary: Reorder tiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  id: {type: integer}
                  group: {type: string}
                  sort: {type: integer}
      responses:
        "200": {description: updated}
  /api/v1/services/{id}:
    parameters: [{$ref: "#/components/parameters/IntID"}]
    put:
      tags: [services]
      operationId: updateService
      summary: Update service
      requestBody: {$ref: "#/components/requestBodies/Service"}
      responses:
        "200": {$ref: "#/components/responses/Service"}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    delete:
      tags: [services]
      operationId: deleteService
      summary: Delete service
      description: The card returns to the found queue; monitors are kept unless `monitors=1`.
      parameters:
        - {name: monitors, in: query, schema: {type: string, enum: ["1"]}}
      responses:
        "204": {description: deleted}
  /api/v1/monitors:
    get:
      tags: [monitors]
      operationId: listMonitors
      summary: Monitors
      responses:
        "200":
          description: monitors with uptime
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/MonitorView"}}
    post:
      tags: [monitors]
      operationId: createMonitor
      summary: Create monitor
      requestBody: {$ref: "#/components/requestBodies/Monitor"}
      responses:
        "201": {$ref: "#/components/responses/Monitor"}
        "400": {$ref: "#/components/responses/Error"}
  /api/v1/monitors/test:
    post:
      tags: [monitors]
      operationId: testMonitor
      summary: Try a check
      description: Runs a check once from the given points without storing anything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spec]
              properties:
                spec: {$ref: "#/components/schemas/CheckSpec"}
                points: {type: array, items: {type: string}}
      responses:
        "200": {$ref: "#/components/responses/CheckOutcome"}
        "400": {$ref: "#/components/responses/Error"}
  /api/v1/monitors/{id}:
    parameters: [{$ref: "#/components/parameters/IntID"}]
    get:
      tags: [monitors]
      operationId: getMonitor
      summary: Monitor details
      parameters:
        - {name: since, in: query, description: "unix ms; default 24 h ago", schema: {type: integer}}
      responses:
        "200":
          description: monitor, uptime, 90 daily aggregates, checks since `since`, recent incidents
          content:
            application/json:
              schema:
                type: object
                properties:
                  monitor: {$ref: "#/components/schemas/Monitor"}
                  uptime: {$ref: "#/components/schemas/Uptime"}
                  days: {type: array, items: {$ref: "#/components/schemas/DayStat"}}
                  checks: {type: array, items: {$ref: "#/components/schemas/CheckRecord"}}
                  incidents: {type: array, items: {$ref: "#/components/schemas/Incident"}}
        "404": {$ref: "#/components/responses/Error"}
    put:
      tags: [monitors]
      operationId: updateMonitor
      summary: Update monitor
      requestBody: {$ref: "#/components/requestBodies/Monitor"}
      responses:
        "200": {$ref: "#/components/responses/Monitor"}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    delete:
      tags: [monitors]
      operationId: deleteMonitor
      summary: Delete monitor
      responses:
        "204": {description: deleted}
  /api/v1/monitors/{id}/check:
    parameters: [{$ref: "#/components/parameters/IntID"}]
    post:
      tags: [monitors]
      operationId: checkNow
      summary: Check now
      responses:
        "200": {$ref: "#/components/responses/CheckOutcome"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/incidents:
    get:
      tags: [monitors]
      operationId: listIncidents
      summary: Incidents
      parameters:
        - {name: open, in: query, schema: {type: string, enum: ["1"]}}
        - {name: monitor, in: query, schema: {type: integer}}
        - {name: days, in: query, schema: {type: integer, default: 30}}
      responses:
        "200":
          description: incidents, newest first
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Incident"}}
  /api/v1/incidents/{id}:
    parameters: [{$ref: "#/components/parameters/IntID"}]
    get:
      tags: [monitors]
      operationId: getIncident
      summary: Incident
      responses:
        "200": {$ref: "#/components/responses/Incident"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/incidents/{id}/ack:
    parameters: [{$ref: "#/components/parameters/IntID"}]
    post:
      tags: [monitors]
      operationId: ackIncident
      summary: Acknowledge incident
      description: Stops reminders (escalation) for the incident.
      responses:
        "200": {$ref: "#/components/responses/Incident"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/incidents/{id}/notes:
    parameters: [{$ref: "#/components/parameters/IntID"}]
    post:
      tags: [monitors]
      operationId: addIncidentNote
      summary: Comment on incident
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [text], properties: {text: {type: string, maxLength: 4000}}}
      responses:
        "201": {$ref: "#/components/responses/Incident"}
        "400": {$ref: "#/components/responses/Error"}
  /api/v1/maintenance:
    get:
      tags: [monitors]
      operationId: listMaintenance
      summary: Maintenance windows
      responses:
        "200":
          description: current and future windows
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Maintenance"}}
    post:
      tags: [monitors]
      operationId: createMaintenance
      summary: Create maintenance window
      description: Planned (`starts`/`ends`) or "right now" (`duration_min`). Notifications are muted inside the window.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: "#/components/schemas/Maintenance"}
                - type: object
                  properties:
                    duration_min: {type: integer}
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Maintenance"}
        "400": {$ref: "#/components/responses/Error"}
  /api/v1/maintenance/{id}:
    parameters: [{$ref: "#/components/parameters/IntID"}]
    delete:
      tags: [monitors]
      operationId: deleteMaintenance
      summary: Delete maintenance window
      responses:
        "204": {description: deleted}
  /api/v1/channels:
    get:
      tags: [notifications]
      operationId: listChannels
      summary: Notification channels
      responses:
        "200":
          description: channels (secrets masked)
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Channel"}}
    post:
      tags: [notifications]
      operationId: createChannel
      summary: Create channel
      requestBody: {$ref: "#/components/requestBodies/Channel"}
      responses:
        "200": {$ref: "#/components/responses/Channel"}
        "400": {$ref: "#/components/responses/Error"}
  /api/v1/channels/{id}:
    parameters: [{$ref: "#/components/parameters/IntID"}]
    put:
      tags: [notifications]
      operationId: updateChannel
      summary: Update channel
      description: Masked secrets (`********`) keep their stored value.
      requestBody: {$ref: "#/components/requestBodies/Channel"}
      responses:
        "200": {$ref: "#/components/responses/Channel"}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    delete:
      tags: [notifications]
      operationId: deleteChannel
      summary: Delete channel
      responses:
        "204": {description: deleted}
  /api/v1/channels/{id}/test:
    parameters: [{$ref: "#/components/parameters/IntID"}]
    post:
      tags: [notifications]
      operationId: testChannel
      summary: Send a test notification
      responses:
        "200": {description: sent}
        "502": {$ref: "#/components/responses/Error"}
  /api/v1/changes:
    get:
      tags: [discovery]
      operationId: listChanges
      summary: Change feed
      parameters:
        - {name: before, in: query, description: return changes with a smaller id, schema: {type: integer}}
        - {name: limit, in: query, schema: {type: integer, default: 100, maximum: 500}}
      responses:
        "200":
          description: changes, newest first
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Change"}}
  /api/v1/dashboard:
    get:
      tags: [services]
      operationId: dashboard
      summary: Dashboard
      responses:
        "200":
          description: tiles, summary and widgets
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Dashboard"}
  /api/v1/search:
    get:
      tags: [services]
      operationId: search
      summary: Search
      description: Command palette search over services, monitors, agents, devices (IP, MAC) and new found services.
      parameters:
        - {name: q, in: query, schema: {type: string}}
      responses:
        "200":
          description: results
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/SearchResult"}}
components:
  securitySchemes:
    cookie: {type: apiKey, in: cookie, name: lanscape_session}
    bearer: {type: http, scheme: bearer}
    metricsToken: {type: http, scheme: bearer}
  parameters:
    IntID: {name: id, in: path, required: true, schema: {type: integer}}
    StrID: {name: id, in: path, required: true, schema: {type: string}}
  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [username, password]
            properties:
              username: {type: string}
              password: {type: string}
              code: {type: string, description: TOTP code when two-factor authentication is enabled}
    Schedule:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Schedule"}
    Service:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Service"}
    Monitor:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/MonitorInput"}
    Channel:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Channel"}
    StatusPage:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/StatusPage"}
  responses:
    ConfigPlan:
      description: plan of the changes (with error when nothing was applied because of it)
      content:
        application/json:
          schema:
            type: object
            properties:
              dry_run: {type: boolean}
              error: {type: string}
              plan:
                type: array
                items:
                  type: object
                  properties:
                    kind: {type: string, enum: [service, monitor, segment, rules, channel, status_page]}
                    name: {type: string}
                    action: {type: string, enum: [create, update, delete, unchanged]}
    ActionResult:
      description: per-agent outcome (ok is true when any agent succeeded)
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: {type: boolean}
              results:
                type: array
                items:
                  type: object
                  properties:
                    agent: {type: string}
                    ok: {type: boolean}
                    detail: {type: string}
    Error:
      description: error
      content:
        application/json:
          schema:
            type: object
            properties:
              error: {type: string}
    Ok:
      description: ok
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: {type: boolean}
    User:
      description: user
      content:
        application/json:
          schema: {$ref: "#/components/schemas/User"}
    Secret:
      description: created; the secret is returned only once
      content:
        application/json:
          schema:
            type: object
            properties:
              id: {type: integer}
              token: {type: string}
    Schedule:
      description: schedule
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Schedule"}
    Service:
      description: service
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Service"}
    Monitor:
      description: monitor
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Monitor"}
    Incident:
      description: incident
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Incident"}
    Channel:
      description: channel (secrets masked)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Channel"}
    StatusPage:
      description: status page
      content:
        application/json:
          schema: {$ref: "#/components/schemas/StatusPage"}
    CheckOutcome:
      description: combined result and the result of every observation point
      content:
        application/json:
          schema:
            type: object
            properties:
              result: {$ref: "#/components/schemas/CheckResult"}
              points: {type: array, items: {$ref: "#/components/schemas/CheckResult"}}
  schemas:
    ConfigFile:
      type: object
      description: declarative configuration, see docs/INSTALL.md (Configuration as code)
      required: [apiVersion]
      properties:
        apiVersion: {type: string, enum: [lanscape/v1]}
        services: {type: array, items: {type: object, additionalProperties: true}}
        monitors: {type: array, items: {type: object, additionalProperties: true}}
        segments: {type: array, items: {type: object, additionalProperties: true}}
        rules: {type: array, items: {type: object, additionalProperties: true}}
        channels: {type: array, items: {type: object, additionalProperties: true}}
        status_pages: {type: array, items: {type: object, additionalProperties: true}}
    Role: {type: string, enum: [viewer, operator, admin]}
    User:
      type: object
      properties:
        id: {type: integer}
        username: {type: string}
        role: {$ref: "#/components/schemas/Role"}
        totp_enabled: {type: boolean}
        disabled: {type: boolean}
        created_at: {type: integer}
    APIToken:
      type: object
      properties:
        id: {type: integer}
        user_id: {type: integer}
        name: {type: string}
        role: {$ref: "#/components/schemas/Role"}
        created_at: {type: integer}
        last_used: {type: integer}
        expires_at: {type: integer}
    AgentToken:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        labels: {type: object, additionalProperties: {type: string}}
        reusable: {type: boolean}
        uses: {type: integer}
        expires_at: {type: integer}
        created_at: {type: integer}
    Iface:
      type: object
      properties:
        name: {type: string}
        mac: {type: string}
        mtu: {type: integer}
        up: {type: boolean}
        carrier: {type: boolean}
        kind: {type: string}
        parent: {type: string}
        master: {type: string}
        members: {type: array, items: {type: string}}
        vlan: {type: integer}
        speed: {type: integer, description: "Mbit/s, 0 when unknown"}
        addrs:
          type: array
          items:
            type: object
            properties:
              ip: {type: string}
              prefix: {type: integer}
    Agent:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        kind: {type: string, enum: [full, lite]}
        online: {type: boolean}
        version: {type: string}
        os: {type: string}
        arch: {type: string}
        hostname: {type: string}
        host_id: {type: string}
        data_port: {type: integer}
        last_seen: {type: integer}
        labels: {type: object, additionalProperties: {type: string}}
        inventory:
          type: object
          properties:
            ifaces: {type: array, items: {$ref: "#/components/schemas/Iface"}}
            routes: {type: array, items: {type: object}}
            rules: {type: array, items: {type: string}}
            neighbors: {type: array, items: {type: object}}
            env: {type: object}
            resources: {type: object}
    Segment:
      type: object
      properties:
        id: {type: string}
        cidr: {type: string}
        vlan: {type: integer}
        expected_mbps: {type: integer}
        manual: {type: boolean}
        name: {type: string}
        members:
          type: array
          items:
            type: object
            properties:
              node: {type: string}
              iface: {type: string}
              ip: {type: string}
              speed: {type: integer}
              mtu: {type: integer}
              kind: {type: string}
    Probe:
      type: object
      nullable: true
      properties:
        status: {type: string}
        size: {type: integer}
        sent: {type: integer}
        recv: {type: integer}
        rtt_min_us: {type: integer}
        rtt_avg_us: {type: integer}
        rtt_p95_us: {type: integer}
        rtt_max_us: {type: integer}
        jitter_us: {type: integer}
    Throughput:
      type: object
      nullable: true
      properties:
        status: {type: string}
        streams: {type: integer}
        bps: {type: integer}
        bps_reverse: {type: integer}
        cpu_local: {type: integer, description: per mille}
        cpu_peer: {type: integer, description: per mille}
        path_ok: {type: boolean}
        verified: {type: boolean}
        sent: {type: integer}
        lost: {type: integer}
        loss_pct: {type: number}
        jitter_us: {type: integer}
    PathResult:
      type: object
      properties:
        seg: {type: integer}
        seg_id: {type: string}
        src: {type: string}
        src_if: {type: string}
        src_ip: {type: string}
        dst: {type: string}
        dst_if: {type: string}
        dst_ip: {type: string}
        ping: {$ref: "#/components/schemas/Probe"}
        echo: {$ref: "#/components/schemas/Probe"}
        mtu: {$ref: "#/components/schemas/Probe"}
        jumbo: {$ref: "#/components/schemas/Probe"}
        tcp1: {$ref: "#/components/schemas/Throughput"}
        tcpn: {$ref: "#/components/schemas/Throughput"}
        udp: {$ref: "#/components/schemas/Throughput"}
        bidir: {$ref: "#/components/schemas/Throughput"}
        route_dev: {type: string}
        expected_mbps: {type: integer}
        best_bps: {type: integer}
        verdict: {type: string, enum: [green, yellow, red, purple, none]}
        mismatch: {type: boolean}
        mtu_ok: {type: boolean}
        loss_high: {type: boolean}
        rtt_high: {type: boolean}
    Problem:
      type: object
      properties:
        kind: {type: string, enum: [tcp_intercepted, mtu, slow, path_mismatch, unreachable, macvlan, loss, cpu_bound, rtt]}
        seg: {type: integer}
        seg_id: {type: string}
        src: {type: string}
        src_if: {type: string}
        dst: {type: string}
        dst_if: {type: string}
        detail: {type: string}
    Anomaly:
      type: object
      properties:
        kind: {type: string}
        key: {type: string}
        nodes: {type: array, items: {type: string}}
        detail: {type: string}
    RunOptions:
      type: object
      properties:
        kind: {type: string, enum: [full, reachability, aggregate]}
        duration_ms: {type: integer}
        streams: {type: integer}
        ping_count: {type: integer}
        udp: {type: boolean}
        udp_rate_kbps: {type: integer}
        bidir: {type: boolean}
        segments: {type: array, items: {type: string}}
        nodes: {type: array, items: {type: string}, description: only these nodes take part}
        involve: {type: array, items: {type: string}, description: "only paths to or from these nodes (agent ids or names)"}
    RunSummary:
      type: object
      properties:
        id: {type: integer}
        kind: {type: string}
        status: {type: string}
        started: {type: integer}
        finished: {type: integer}
        params: {$ref: "#/components/schemas/RunOptions"}
    Progress:
      type: object
      nullable: true
      properties:
        id: {type: integer}
        kind: {type: string}
        done: {type: integer}
        total: {type: integer}
        eta_s: {type: integer}
        step: {type: string}
    Report:
      type: object
      nullable: true
      properties:
        id: {type: integer}
        kind: {type: string}
        status: {type: string, enum: [done, cancelled, running]}
        started: {type: integer}
        finished: {type: integer}
        options: {$ref: "#/components/schemas/RunOptions"}
        nodes:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              name: {type: string}
              kind: {type: string}
              env: {type: string}
              arch: {type: string}
        segments: {type: array, items: {$ref: "#/components/schemas/Segment"}}
        paths: {type: array, items: {$ref: "#/components/schemas/PathResult"}}
        problems: {type: array, items: {$ref: "#/components/schemas/Problem"}}
        anomalies: {type: array, items: {$ref: "#/components/schemas/Anomaly"}}
        aggregate:
          type: array
          items:
            type: object
            properties:
              seg: {type: integer}
              seg_id: {type: string}
              total_bps: {type: integer}
              pairs: {type: integer}
              node_out_bps: {type: object, additionalProperties: {type: integer}}
              node_in_bps: {type: object, additionalProperties: {type: integer}}
    MapGraph:
      type: object
      properties:
        run_id: {type: integer}
        nodes:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              label: {type: string}
              type: {type: string, enum: [device, port, segment, zone, service, switch]}
              parent: {type: string}
              icon: {type: string}
              status: {type: string}
              data: {type: object}
        edges:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              source: {type: string}
              target: {type: string}
              type: {type: string, enum: [link, path, dependency]}
              verdict: {type: string}
              label: {type: string}
              segment: {type: string, description: segment of a path edge}
        hypotheses:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              segment: {type: string}
              mbps: {type: integer}
              group_a: {type: array, items: {type: string}}
              group_b: {type: array, items: {type: string}}
              detail: {type: string}
              accepted: {type: boolean}
    IPAM:
      type: object
      properties:
        segment: {type: string}
        cidr: {type: string}
        size: {type: integer}
        used: {type: integer}
        free: {type: integer}
        pool_size: {type: integer}
        entries:
          type: array
          items:
            type: object
            properties:
              ip: {type: string}
              node: {type: string}
              iface: {type: string}
              mac: {type: string}
              name: {type: string}
              source: {type: string}
              in_pool: {type: boolean}
    Schedule:
      type: object
      required: [name, kind, spec]
      properties:
        id: {type: integer}
        name: {type: string}
        kind: {type: string, enum: [full, reachability, aggregate]}
        spec: {type: string, example: every 5m}
        enabled: {type: boolean}
        params: {$ref: "#/components/schemas/RunOptions"}
        last_run: {type: integer}
    Settings:
      type: object
      properties:
        duration_ms: {type: integer}
        streams: {type: integer}
        ping_count: {type: integer}
        rtt_warn_ms: {type: integer}
        mini_token: {type: string, description: masked on read}
        webhooks: {type: array, items: {type: string}, description: "URLs that receive {event, run|incident|change} JSON for run.finished, incident.opened, incident.resolved, incident.reminder and device.new"}
        retention_days: {type: integer}
        guest_dashboard: {type: boolean, description: "anonymous visitors see a reduced read-only dashboard"}
        aggregate_days: {type: integer, description: "daily uptime and Internet history, 0 = keep forever (default 730)"}
        internet_points: {type: array, items: {type: string}, description: '"server" or agent ids'}
        internet_every_min: {type: integer, description: "address check period in minutes, 0 = off"}
        internet_speed_every_h: {type: integer, description: "speed test period in hours, 0 = off"}
        internet_ip_url: {type: string}
        internet_download_url: {type: string}
        public_url: {type: string}
    AuditEntry:
      type: object
      properties:
        id: {type: integer}
        ts: {type: integer}
        actor: {type: string}
        action: {type: string}
        target: {type: string}
        result: {type: string}
        detail: {type: string}
    Address:
      type: object
      properties:
        type: {type: string, enum: [internal, external, hostport, workload, container, process, vm, ip]}
        value: {type: string}
        agent: {type: string}
    AppMatch:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        category: {type: string}
        icon: {type: string}
        score: {type: integer}
        monitor:
          type: object
          properties:
            type: {type: string}
            path: {type: string}
    FoundCard:
      type: object
      properties:
        key: {type: string, description: "stable card key, e.g. k8s:deploy/forge/gitea or docker:<agent>:<container>"}
        name: {type: string}
        app: {$ref: "#/components/schemas/AppMatch"}
        kind: {type: string}
        namespace: {type: string}
        agents: {type: array, items: {type: string}}
        state: {type: string}
        health: {type: string}
        internal_url: {type: string}
        external_url: {type: string}
        host_port: {type: string}
        tls: {type: boolean}
        cert_not_after: {type: integer}
        addresses: {type: array, items: {$ref: "#/components/schemas/Address"}}
        refs:
          type: array
          items:
            type: object
            properties:
              agent: {type: string}
              source: {type: string, enum: [sockets, docker, k8s, proxmox, mdns, ssdp, openwrt, scan, proxy, dns, host, prometheus, homeassistant]}
              key: {type: string}
              kind: {type: string}
              gone: {type: boolean}
        gone: {type: boolean}
        first_seen: {type: integer}
        monitor: {$ref: "#/components/schemas/CheckSpec"}
        status: {type: string, enum: [new, added, ignored, hidden]}
        service_id: {type: integer}
        rule: {type: string}
    Rule:
      type: object
      required: [name, action]
      properties:
        name: {type: string}
        kind: {type: string, enum: ["", ingress, k8s, container, socket]}
        app: {type: string, description: application id glob; "*" = any recognised application}
        category: {type: string}
        tls_only: {type: boolean}
        action: {type: string, enum: [add, ignore]}
        monitor: {type: boolean}
        tile: {type: boolean}
        group: {type: string}
    Service:
      type: object
      required: [name]
      properties:
        id: {type: integer, readOnly: true}
        name: {type: string, maxLength: 100}
        app_id: {type: string}
        icon: {type: string}
        category: {type: string}
        group: {type: string}
        internal_url: {type: string}
        external_url: {type: string}
        addresses: {type: array, items: {$ref: "#/components/schemas/Address"}}
        card_key: {type: string, readOnly: true}
        tile: {type: boolean}
        sort: {type: integer}
        notes: {type: string}
        created_at: {type: integer, readOnly: true}
    ServiceView:
      allOf:
        - {$ref: "#/components/schemas/Service"}
        - type: object
          properties:
            status: {type: string}
            latency_ms: {type: number}
            monitors: {type: array, items: {type: integer}}
            url: {type: string, description: "internal URL for local clients, external otherwise"}
            uptime_day: {type: number, nullable: true}
            incident_id: {type: integer}
    CheckSpec:
      type: object
      required: [type, target]
      properties:
        type: {type: string, enum: [http, tcp, udp, icmp, dns, tls, domain, heartbeat, composite, container, k8s, vm]}
        target: {type: string, description: "URL (http), host:port (tcp, udp, tls), host (icmp), record name (dns), domain, or <source>:<agent|*>:<key> for container, k8s and vm; not used by heartbeat and composite"}
        timeout_ms: {type: integer}
        method: {type: string}
        expect_status: {type: array, items: {type: integer}, description: "exact codes or classes (2 = 2xx); default 200-399"}
        keyword: {type: string}
        keyword_regex: {type: boolean}
        invert_keyword: {type: boolean}
        json_path: {type: string}
        json_value: {type: string}
        headers: {type: object, additionalProperties: {type: string}}
        basic_user: {type: string}
        basic_password: {type: string}
        bearer: {type: string}
        no_redirects: {type: boolean}
        ignore_tls_errors: {type: boolean}
        send: {type: string}
        expect: {type: string}
        server: {type: string}
        record: {type: string, enum: [A, AAAA, CNAME, MX, TXT, NS]}
        warn_days: {type: integer}
        grace_s: {type: integer, description: "heartbeat: silence tolerated beyond the interval"}
        expr: {type: string, description: "composite: expression over monitor ids, e.g. #1 && (#2 || #3)"}
    CheckResult:
      type: object
      properties:
        status: {type: string, enum: [up, down, degraded, unknown]}
        latency_ms: {type: number}
        message: {type: string}
        code: {type: integer}
        cert_not_after: {type: integer}
        cert_names: {type: array, items: {type: string}}
        at: {type: integer}
        point: {type: string}
    MonitorInput:
      type: object
      required: [name, spec]
      properties:
        service_id: {type: integer}
        name: {type: string}
        spec: {$ref: "#/components/schemas/CheckSpec"}
        interval_s: {type: integer, minimum: 5, maximum: 86400, default: 60}
        retries: {type: integer, default: 3, description: failed checks in a row before an incident opens}
        points: {type: array, items: {type: string}, description: "observation points: server and/or agent ids"}
        min_failing: {type: integer, default: 1, description: points that must fail}
        sla: {type: number}
        enabled: {type: boolean, default: true}
        parents: {type: array, items: {type: integer}, description: "incidents are suppressed while a parent monitor is down"}
    Monitor:
      allOf:
        - {$ref: "#/components/schemas/MonitorInput"}
        - type: object
          properties:
            id: {type: integer}
            status: {type: string, enum: [pending, up, degraded, down, paused, maintenance]}
            last_check: {type: integer}
            last_latency: {type: number}
            last_message: {type: string}
            cert_not_after: {type: integer}
            created_at: {type: integer}
            push_token: {type: string, description: "heartbeat monitors: token of the push URL /api/push/{token}"}
            last_push: {type: integer}
    Uptime:
      type: object
      properties:
        day: {type: number, nullable: true}
        week: {type: number, nullable: true}
        month: {type: number, nullable: true}
        year: {type: number, nullable: true}
    MonitorView:
      allOf:
        - {$ref: "#/components/schemas/Monitor"}
        - type: object
          properties:
            uptime: {$ref: "#/components/schemas/Uptime"}
            incident_id: {type: integer}
    CheckRecord:
      type: object
      properties:
        ts: {type: integer}
        status: {type: string}
        latency_ms: {type: number}
        point: {type: string}
        message: {type: string}
    DayStat:
      type: object
      properties:
        day: {type: integer, description: yyyymmdd}
        up: {type: integer}
        down: {type: integer}
        degraded: {type: integer}
        maint: {type: integer}
    Incident:
      type: object
      properties:
        id: {type: integer}
        monitor_id: {type: integer}
        monitor: {type: string}
        opened: {type: integer}
        closed: {type: integer}
        cause: {type: string}
        acked_by: {type: string}
        acked_at: {type: integer}
        parent_id: {type: integer}
        maintenance: {type: boolean}
        suppressed: {type: boolean, description: caused by a parent monitor or an offline agent; not notified}
        notified: {type: integer}
        notes:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              ts: {type: integer}
              author: {type: string}
              text: {type: string}
    Maintenance:
      type: object
      properties:
        id: {type: integer, readOnly: true}
        name: {type: string}
        starts: {type: integer}
        ends: {type: integer}
        monitors: {type: array, items: {type: integer}, description: empty = all monitors}
        created_by: {type: string, readOnly: true}
        created_at: {type: integer, readOnly: true}
    Channel:
      type: object
      required: [type, config]
      properties:
        id: {type: integer, readOnly: true}
        name: {type: string}
        type: {type: string, enum: [telegram, webhook, email, ntfy, gotify, discord, slack, matrix]}
        enabled: {type: boolean}
        config:
          type: object
          description: |
            Type-specific settings plus common ones (quiet "22:00-07:00", repeat_minutes, monitors, no_resolved).
            telegram: bot_token, chat_id, api_url. webhook: url, headers, secret (HMAC-SHA256 in X-Lanscape-Signature).
            email: host, port, username, password, from, to, tls (starttls, tls, none). ntfy: url, topic, token, priority.
            gotify: url, token, priority. discord, slack: url (incoming webhook). matrix: homeserver, access_token, room_id.
          additionalProperties: true
        created_at: {type: integer, readOnly: true}
    Change:
      type: object
      properties:
        id: {type: integer}
        ts: {type: integer}
        kind:
          type: string
          enum: [service_new, port_opened, port_closed, container_gone, container_stopped, container_started, ip_changed,
            object_new, object_gone, device_new, mac_new, hardware]
        subject: {type: string}
        detail: {type: string}
        agent_id: {type: string}
    Dashboard:
      type: object
      properties:
        groups:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              tiles: {type: array, items: {$ref: "#/components/schemas/ServiceView"}}
        summary: {type: object, additionalProperties: {type: integer}}
        incidents: {type: array, items: {$ref: "#/components/schemas/Incident"}}
        network:
          type: object
          nullable: true
          properties:
            run_id: {type: integer}
            finished: {type: integer}
            status: {type: string}
            paths: {type: integer}
            verdicts: {type: object, additionalProperties: {type: integer}}
            problems: {type: integer}
        agents:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              name: {type: string}
              online: {type: boolean}
              cpus: {type: integer}
              load1: {type: number}
              mem_total: {type: integer}
              mem_available: {type: integer}
              temp_c: {type: number}
              disk_pct: {type: number}
              disk_mount: {type: string}
              updates: {type: integer}
        certificates:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              not_after: {type: integer}
              source: {type: string, enum: [monitor, discovery]}
              ref: {type: string}
        changes: {type: array, items: {$ref: "#/components/schemas/Change"}}
        found_new: {type: integer}
        maintenance: {type: array, items: {$ref: "#/components/schemas/Maintenance"}}
        ups: {type: array, items: {$ref: "#/components/schemas/Hardware"}}
        storage: {type: array, items: {$ref: "#/components/schemas/Hardware"}}
        backups:
          type: array
          items:
            type: object
            properties:
              monitor_id: {type: integer}
              name: {type: string}
              status: {type: string}
              last_push: {type: integer}
    SearchResult:
      type: object
      properties:
        type: {type: string, enum: [service, monitor, agent, device, found]}
        id: {type: string}
        title: {type: string}
        subtitle: {type: string}
        url: {type: string}
        href: {type: string}
        status: {type: string}
    StatusPage:
      type: object
      required: [slug]
      properties:
        id: {type: integer, readOnly: true}
        slug: {type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$"}
        title: {type: string}
        public: {type: boolean}
        token: {type: string, readOnly: true, description: "link token for pages that are not public"}
        domain: {type: string, description: custom domain served at /}
        config:
          type: object
          properties:
            description: {type: string}
            groups:
              type: array
              items:
                type: object
                properties:
                  name: {type: string}
                  monitors: {type: array, items: {type: integer}}
            accent: {type: string}
            logo_url: {type: string}
            theme: {type: string, enum: ["", auto, light, dark]}
            footer: {type: string}
        created_at: {type: integer, readOnly: true}
    Hardware:
      type: object
      properties:
        agent: {type: string}
        kind: {type: string, enum: [ups, disk, pool]}
        name: {type: string}
        state: {type: string, description: "UPS: online, on_battery, low_battery, replace_battery; disk: passed, warning, failing; pool: ZFS health"}
        labels: {type: object, additionalProperties: {type: string}}
