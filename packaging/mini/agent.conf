# Lanscape Mini agent configuration (key=value). Environment variables LSM_<KEY> override it.
# Address of lsm-server (or a Lanscape server with the Mini port enabled), port 47701 by default.
server=192.168.1.10:47701
# Shared token, the same as on the server.
token=change-me
# Agent id shown on the map; defaults to the hostname.
#id=router
# Interfaces never used for tests (comma separated globs).
exclude=wan*,pppoe-*,tailscale*,docker*,veth*,cni*,flannel*,lxc*,virbr*
max_duration_ms=30000
max_streams=8
