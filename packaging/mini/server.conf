# Lanscape Mini server configuration (key=value). Environment variables LSM_<KEY> override it.
token=change-me
listen=:8080
ctl_listen=:47701
data_file=/var/lib/lsm/runs.json
keep_runs=20
duration_ms=5000
streams=4
ping_count=10
rtt_warn_ms=20
# Expected speed for segments whose links do not report a speed (virtio): cidr:Mbit/s,...
#expect=10.30.0.0/24:2500,10.31.0.0/24:1000
# POST the finished run as JSON (http:// only).
#webhook=http://192.168.1.20:8000/lanscape
# Password for POST requests (user "admin"); empty disables authentication.
#password=
